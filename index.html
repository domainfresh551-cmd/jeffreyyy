
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeffrey Gutierrez | Portfolio</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root {
  --pink: #ff2d75;
  --bg: #080808;
  --surface: #111;
  --surface2: #171717;
  --text: #f8f8f8;
  --muted: #b0b0b0;
  --line: #2b2b2b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

body.light {
  --bg: #f7f7fb;
  --surface: #fff;
  --surface2: #f0f0f5;
  --text: #171717;
  --muted: #5e5e68;
  --line: #dedee6;
}

a {
  color: inherit;
}

button, input, textarea {
  font: inherit;
}

/* NAVIGATION */

nav {
  height: 76px;
  position: fixed;
  z-index: 10;
  top: 0;
  left: 0;
  width: 100%;
  padding: 0 8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 26px;
  font-weight: 900;
  text-decoration: none;
}

.logo span,
h1 span,
h2 span {
  color: var(--pink);
}

.nav-links {
  display: flex;
  gap: 27px;
}

.nav-links a {
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  color: var(--muted);
  transition: 0.3s;
}

.nav-links a:hover {
  color: var(--pink);
}

.theme {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

/* GENERAL SECTIONS */

section {
  padding: 105px 8%;
  scroll-margin-top: 70px;
}

.eyebrow,
.section-kicker {
  color: var(--pink);
  letter-spacing: 3px;
  font-weight: bold;
  font-size: 13px;
}

.section-head {
  margin-bottom: 35px;
}

.section-head h2 {
  font-size: clamp(38px, 5vw, 56px);
  line-height: 1.1;
  margin-top: 9px;
}

/* HOME */

.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  align-items: center;
  gap: 60px;
  padding-top: 135px;
  background: radial-gradient(
    ellipse at 80% 35%,
    #ff2d751a,
    transparent 45%
  );
}

h1 {
  font-size: clamp(50px, 7vw, 90px);
  line-height: 1.05;
  margin: 16px 0 22px;
}

.hero h2 {
  font-size: clamp(18px, 2.2vw, 25px);
  margin-bottom: 16px;
}

.description {
  color: var(--muted);
  max-width: 610px;
  line-height: 1.9;
}

.buttons {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 21px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  border: 1px solid var(--line);
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-3px);
}

.primary {
  background: var(--pink);
  border-color: var(--pink);
  color: white;
}

.secondary {
  background: var(--surface);
  color: var(--text);
}

/* CENTERED PROFILE PHOTO */

.hero-card {
  justify-self: center;
  align-self: center;
  width: min(100%, 350px);
  margin-left: auto;
  margin-right: auto;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 20px 55px #0005;
}

.portrait {
  display: block;
  width: 100%;
  height: 360px;
  margin-left: auto;
  margin-right: auto;
  object-fit: cover;
  object-position: center center;
  border-radius: 16px;
  border: 2px solid var(--pink);
}

.hero-card h3 {
  font-size: 23px;
  margin-top: 17px;
}

.role {
  color: var(--pink);
  font-weight: bold;
}

.pills {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.pill {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 100px;
  padding: 7px 10px;
  font-size: 12px;
}

/* ABOUT */

.about-grid,
.contact-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 25px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 30px;
}

.panel h3 {
  font-size: 23px;
  margin-bottom: 15px;
}

.panel p {
  color: var(--muted);
  line-height: 1.85;
  margin-bottom: 12px;
}

.info-list {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.info-item {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.info-item:last-child {
  border-bottom: 0;
}

.info-item strong {
  color: var(--pink);
}

.info-item span {
  text-align: right;
  color: var(--muted);
}

/* SKILLS */

.alt-section {
  background: var(--surface2);
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.skill {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 22px;
  transition: 0.3s;
}

.skill:hover,
.project:hover {
  transform: translateY(-5px);
  border-color: var(--pink);
}

.skill-num {
  color: var(--pink);
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 13px;
}

.skill h3 {
  margin-bottom: 15px;
}

.bar {
  height: 6px;
  background: var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.progress {
  height: 100%;
  background: var(--pink);
  border-radius: 10px;
}

/* PROJECTS */

.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.project {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 27px;
  min-height: 300px;
  transition: 0.3s;
}

.project-num {
  font-size: 43px;
  color: var(--pink);
  font-weight: bold;
  margin-bottom: 25px;
}

.project h3 {
  font-size: 21px;
  margin-bottom: 12px;
}

.project p {
  color: var(--muted);
  line-height: 1.8;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 19px;
}

.tag {
  color: var(--pink);
  border: 1px solid var(--line);
  padding: 5px 9px;
  border-radius: 100px;
  font-size: 12px;
}

/* CONTACT */

.contact-grid {
  align-items: start;
}

.contact-detail {
  display: flex;
  gap: 13px;
  margin-top: 23px;
}

.contact-detail strong {
  color: var(--pink);
  display: block;
}

.contact-detail span {
  color: var(--muted);
  overflow-wrap: anywhere;
}

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 14px 15px;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  outline: none;
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: var(--pink);
}

.contact-form textarea {
  resize: vertical;
}

.send {
  border: 0;
  border-radius: 8px;
  padding: 14px;
  background: var(--pink);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.form-note,
.note {
  color: var(--muted);
  font-size: 13px;
}

/* FOOTER */

footer {
  padding: 30px 8%;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

footer p {
  color: var(--muted);
  font-size: 13px;
}

.socials {
  display: flex;
  gap: 16px;
}

.socials a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
}

.socials a:hover {
  color: var(--pink);
}

/* RESPONSIVE DESIGN */

@media (max-width: 900px) {
  nav {
    padding: 0 5%;
  }

  .nav-links {
    gap: 15px;
  }

  .hero {
    grid-template-columns: 1fr;
    gap: 35px;
    text-align: center;
  }

  .description {
    margin: auto;
  }

  .buttons {
    justify-content: center;
  }

  .hero-card {
    width: min(100%, 330px);
  }

  .portrait {
    height: 320px;
  }

  .about-grid,
  .contact-grid {
    grid-template-columns: 1fr;
  }

  .skills-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .projects-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 580px) {
  nav {
    height: 68px;
  }

  .logo {
    font-size: 22px;
  }

  .nav-links {
    display: none;
  }

  section {
    padding: 78px 5%;
  }

  .hero {
    padding-top: 115px;
  }

  h1 {
    font-size: 45px;
  }

  .section-head h2 {
    font-size: 40px;
  }

  .panel {
    padding: 23px;
  }

  .skills-grid,
  .projects-grid {
    grid-template-columns: 1fr;
  }

  .info-item {
    font-size: 14px;
  }

  footer {
    padding: 25px 5%;
    justify-content: center;
    text-align: center;
    flex-direction: column;
  }
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// Keep jeffrey.jfif in the same folder as this HTML file.
const portrait = "jeffrey.jfif";

function App() {
  const [dark, setDark] = React.useState(true);

  const skills = [
    { name: "HTML", level: 90 },
    { name: "CSS", level: 85 },
    { name: "JavaScript", level: 80 },
    { name: "ReactJS", level: 75 },
    { name: "Java", level: 75 },
    { name: "PHP", level: 75 },
    { name: "MySQL", level: 70 },
    { name: "Git", level: 65 }
  ];

  const projects = [
    {
      number: "01",
      title: "Personal Portfolio",
      description:
        "A responsive portfolio website that presents my background, skills, and projects.",
      tags: ["ReactJS", "JavaScript", "CSS"]
    },
    {
      number: "02",
      title: "Grade Calculator",
      description:
        "A web application concept for calculating student grades and displaying final results.",
      tags: ["HTML", "CSS", "JavaScript"]
    },
    {
      number: "03",
      title: "ATM Simulation",
      description:
        "A Java project that practices account balances, arrays, and object-oriented programming.",
      tags: ["Java", "OOP", "Arrays"]
    }
  ];

  function handleSubmit(e) {
    e.preventDefault();

    const data = new FormData(e.currentTarget);
    const subject = encodeURIComponent(data.get("subject"));

    const body = encodeURIComponent(
      "From: " + data.get("name") +
      " (" + data.get("email") + ")\n\n" +
      data.get("message")
    );

    // Replace with your real email address.
    window.location.href =
      "mailto:jeffrey@example.com?subject=" +
      subject + "&body=" + body;
  }

  function toggleTheme() {
    setDark(!dark);
    document.body.classList.toggle("light", dark);
  }

  return (
    <div className={dark ? "site" : "site light"}
         style={{ minHeight: "100vh" }}>

      {/* NAVIGATION */}

      <nav>
        <a className="logo" href="#home">
          JEFF<span>.</span>
        </a>

        <div className="nav-links">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#skills">Skills</a>
          <a href="#projects">Projects</a>
          <a href="#contact">Contact</a>
        </div>

        <button
          className="theme"
          onClick={toggleTheme}
          aria-label="Toggle color theme"
        >
          {dark ? "☀️" : "🌙"}
        </button>
      </nav>

      <main>

        {/* HOME */}

        <section className="hero" id="home">

          <div className="hero-text">
            <p className="eyebrow">HELLO, I'M</p>

            <h1>
              Jeffrey <span>Gutierrez</span>
            </h1>

            <h2>
              BSIT Student · Aspiring Web Developer
            </h2>

            <p className="description">
              I'm an Information Technology student who
              enjoys building websites, exploring programming,
              and learning how technology can solve everyday
              problems. I'm always working to improve my
              skills one project at a time.
            </p>

            <div className="buttons">
              <a href="#projects" className="btn primary">
                Explore My Projects ↗
              </a>

              <a href="#contact" className="btn secondary">
                Get In Touch
              </a>
            </div>
          </div>

          {/* CENTERED PHOTO CARD */}

          <aside className="hero-card">

            <img
              className="portrait"
             img src="jeffrey.jfif" 
            />

            <h3>Jeffrey Gutierrez</h3>
            <p className="role">BSIT Student</p>

            <div className="pills">
              <span className="pill">💻 Coding</span>
              <span className="pill">🏀 Basketball</span>
              <span className="pill">🎮 Gaming</span>
              <span className="pill">🏃 Running</span>
            </div>

          </aside>

        </section>

        {/* ABOUT */}

        <section id="about">

          <div className="section-head">
            <p className="section-kicker">GET TO KNOW ME</p>
            <h2>About <span>Me</span></h2>
          </div>

          <div className="about-grid">

            <article className="panel">
              <h3>A Little About Me</h3>

              <p>
                Hi! I'm Jeffrey Gutierrez, a Bachelor of
                Science in Information Technology student.
                I'm interested in web development, programming,
                and building digital experiences.
              </p>

              <p>
                I enjoy learning new technologies and
                practicing through school activities and
                personal projects. My goal is to keep growing
                as a developer and create useful applications.
              </p>

              <p>
                Outside programming, I enjoy playing basketball,
                gaming, and running.
              </p>
            </article>

            <div className="panel info-list">

              <div className="info-item">
                <strong>Name</strong>
                <span>Jeffrey Gutierrez</span>
              </div>

              <div className="info-item">
                <strong>Course</strong>
                <span>BS Information Technology</span>
              </div>

              <div className="info-item">
                <strong>Location</strong>
                <span>Nueva Vizcaya, Philippines</span>
              </div>

              <div className="info-item">
                <strong>Focus</strong>
                <span>Web Development</span>
              </div>

              <div className="info-item">
                <strong>Interests</strong>
                <span>Code, sports & gaming</span>
              </div>

            </div>
          </div>
        </section>

        {/* SKILLS */}

        <section className="alt-section" id="skills">

          <div className="section-head">
            <p className="section-kicker">WHAT I'M LEARNING</p>
            <h2>My <span>Skills</span></h2>
          </div>

          <div className="skills-grid">

            {skills.map((skill, index) => (
              <article className="skill" key={skill.name}>

                <p className="skill-num">
                  {String(index + 1).padStart(2, "0")}
                </p>

                <h3>{skill.name}</h3>

                <div
                  className="bar"
                  role="progressbar"
                  aria-label={skill.name}
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow={skill.level}
                >
                  <div
                    className="progress"
                    style={{ width: skill.level + "%" }}
                  ></div>
                </div>

              </article>
            ))}

          </div>

          <p className="note" style={{ marginTop: "18px" }}>
            Adjust the skill bars to match your actual experience.
          </p>

        </section>

        {/* PROJECTS */}

        <section id="projects">

          <div className="section-head">
            <p className="section-kicker">THINGS I'VE PRACTICED</p>
            <h2>Selected <span>Projects</span></h2>
          </div>

          <div className="projects-grid">

            {projects.map(project => (
              <article
                className="project"
                key={project.number}
              >

                <div className="project-num">
                  {project.number}
                </div>

                <h3>{project.title}</h3>
                <p>{project.description}</p>

                <div className="tags">
                  {project.tags.map(tag => (
                    <span className="tag" key={tag}>
                      {tag}
                    </span>
                  ))}
                </div>

              </article>
            ))}

          </div>

          <p className="note" style={{ marginTop: "18px" }}>
            Add links or screenshots when you have published
            versions of your projects.
          </p>

        </section>

        {/* CONTACT */}

        <section className="alt-section" id="contact">

          <div className="section-head">
            <p className="section-kicker">LET'S CONNECT</p>
            <h2>Contact <span>Me</span></h2>
          </div>

          <div className="contact-grid">

            <div className="panel">
              <h3>Have an Idea in Mind?</h3>

              <p>
                If you'd like to discuss a school project,
                collaboration, or web development opportunity,
                send me a message.
              </p>

              <div className="contact-detail">
                <span>📧</span>
                <div>
                  <strong>Email</strong>
                  <span>domain.fresh551@gamil.com</span>
                </div>
              </div>

              <div className="contact-detail">
                <span>📍</span>
                <div>
                  <strong>Location</strong>
                  <span>Nueva Vizcaya, Philippines</span>
                </div>
              </div>

              <p style={{ marginTop: "20px" }}>
                Replace the example email with your real
                email address before publishing.
              </p>
            </div>

            <form
              className="panel contact-form"
              onSubmit={handleSubmit}
            >

              <input
                name="name"
                type="text"
                placeholder="Your name"
                autoComplete="name"
                required
              />

              <input
                name="email"
                type="email"
                placeholder="Your email"
                autoComplete="email"
                required
              />

              <input
                name="subject"
                type="text"
                placeholder="Subject"
                required
              />

              <textarea
                name="message"
                rows="5"
                placeholder="Your message"
                required
              ></textarea>

              <button className="send" type="submit">
                Prepare Email ↗
              </button>

              <p className="form-note">
                This opens your email app. Messages are not
                saved to a database.
              </p>

            </form>

          </div>
        </section>

      </main>

      {/* FOOTER */}

      <footer>

        <a className="logo" href="#home">
          JEFF<span>.</span>
        </a>

        <p>
          © {new Date().getFullYear()} Jeffrey Gutierrez.
          All Rights Reserved.
        </p>

        <div className="socials">
          <a href="#contact">Contact</a>
          <a href="#projects">Projects</a>
          <a href="#home">Back to Top ↑</a>
        </div>

      </footer>

    </div>
  );
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />);

</script>
</body>
</html>
